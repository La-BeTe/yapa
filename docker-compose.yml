name: yapa

services:
  api:
    build: .
    ports:
      - '${API_PORT:-3000}:3000'
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGO_URI: mongodb://mongo:27017/yapa
      REDIS_URL: redis://redis:6379
      TB_CLUSTER_ID: '0'
      TB_ADDRESS: tigerbeetle:3000
      ADMIN_API_KEY: ${ADMIN_API_KEY:-change-me}
      FX_API_URL: ${FX_API_URL:-https://open.er-api.com/v6/latest/USD}
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      tigerbeetle:
        condition: service_healthy
    restart: unless-stopped

  mongo:
    image: mongo:7
    # Published for local development (`yarn start:dev` against the containers).
    ports:
      - '${MONGO_PORT:-27017}:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    # BullMQ requires that Redis never evicts keys.
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  tigerbeetle:
    build: ./docker/tigerbeetle
    # Host port 3001 because the API uses 3000.
    ports:
      - '${TB_PORT:-3001}:3000'
    volumes:
      - tigerbeetle-data:/data
    # Docker >= 25 blocks io_uring under the default seccomp profile, and
    # TigerBeetle locks its memory, which Docker Desktop restricts by default.
    security_opt:
      - seccomp=unconfined
    cap_add:
      - IPC_LOCK
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test: ['CMD', 'nc', '-z', '127.0.0.1', '3000']
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

volumes:
  mongo-data:
  redis-data:
  tigerbeetle-data:
